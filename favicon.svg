<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#6C63FF"/>
  <!-- Book cover -->
  <rect x="12" y="10" width="28" height="38" rx="3" fill="#fff" opacity=".95"/>
  <!-- Spine -->
  <rect x="10" y="10" width="5" height="38" rx="2" fill="#4a44cc"/>
  <!-- Lines on book -->
  <rect x="17" y="18" width="18" height="2.5" rx="1.2" fill="#6C63FF" opacity=".5"/>
  <rect x="17" y="24" width="18" height="2.5" rx="1.2" fill="#6C63FF" opacity=".5"/>
  <rect x="17" y="30" width="12" height="2.5" rx="1.2" fill="#6C63FF" opacity=".5"/>
  <!-- Star accent -->
  <circle cx="46" cy="20" r="8" fill="#00BFA6"/>
  <text x="46" y="24" text-anchor="middle" font-size="11" fill="#fff" font-family="Arial" font-weight="bold">A+</text>
</svg>
